name: Flutter CI

# 通过 GitHub Actions 编译与校验（本项目本机未安装 Flutter SDK，CI 即编译器）。
#
# 触发：push 到任意分支、以及针对 main 的 PR。
on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  # 固定 Flutter 版本，保证构建可复现（开发文档 §4.1 要求写入 README）。
  FLUTTER_VERSION: '3.24.5'
  FLUTTER_CHANNEL: 'stable'

jobs:
  analyze-test-build:
    name: analyze / test / build apk
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Show toolchain versions
        run: |
          flutter --version
          dart --version
          java -version

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting (non-blocking report)
        run: dart format --output=none --set-exit-if-changed lib test || true

      - name: Analyze
        # 验收要求：flutter analyze 无 error。
        # 第三方包/框架 API 的弃用告警不作为门禁（见 analysis_options.yaml）。
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Unit tests
        # 验收要求：栅格解析、巡逻状态机、动作名解析有单元测试且通过。
        # 纯逻辑单测不接触网络；不涉及任何移动指令下发（FR-SAFE-05）。
        run: flutter test --reporter expanded

      - name: Generate Android platform project
        # android/ 目录不入库，由 CI 现场生成（见 .gitignore 与 README）。
        # --project-name 必须显式指定：否则会用仓库目录名（robot-ops-app，含连字符）作为
        # Dart 包名，而 Dart 包名只允许 [a-z0-9_]。
        run: flutter create --platforms=android --org com.wizrole --project-name robot_ops_app .

      - name: Harden Android project
        # 注入 usesCleartextTraffic、INTERNET 权限与中文 App 名称（开发文档 §8.3）。
        run: python3 tool/prepare_android.py

      - name: Upload hardening artifacts for inspection
        uses: actions/upload-artifact@v4
        with:
          name: android-platform-gradle
          path: |
            android/app/src/main/AndroidManifest.xml
            android/app/build.gradle*
          if-no-files-found: warn

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Build release APK (unsigned distribution build)
        run: flutter build apk --release

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: robot-ops-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

      - name: Inspect APK metadata and signatures
        # 诊断步骤：打印包名/版本/minSdk/targetSdk 与签名方案（v1/v2/v3）及证书指纹。
        # 目的：定位真机安装失败（如安装器报 "PackageInfo is null"）时，区分两类原因：
        #   (a) APK 签名缺失/无 v1 签名 → 安装器解析包信息失败；
        #   (b) 不同构建轮次签名证书不一致 → 覆盖安装被系统拒绝。
        run: |
          ls -l build/app/outputs/flutter-apk/
          BT=$(ls -d /usr/local/lib/android/sdk/build-tools/* | sort -V | tail -1)
          for APK in build/app/outputs/flutter-apk/app-debug.apk build/app/outputs/flutter-apk/app-release.apk; do
            echo "=================== $APK ==================="
            unzip -l "$APK" | grep -i "META-INF/" || echo "(no META-INF entries)"
            "$BT/aapt" dump badging "$APK" | grep -E "^package|sdkVersion|targetSdkVersion|application-label|native-code" || true
            "$BT/apksigner" verify --verbose --print-certs "$APK" || true
          done
