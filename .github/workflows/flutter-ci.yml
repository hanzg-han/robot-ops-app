name: Flutter CI

# 通过 GitHub Actions 编译与校验（本项目本机未安装 Flutter SDK，CI 即编译器）。
#
# 触发：push 到任意分支、以及针对 main 的 PR。
on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  # 固定 Flutter 版本，保证构建可复现（开发文档 §4.1 要求写入 README）。
  FLUTTER_VERSION: '3.24.5'
  FLUTTER_CHANNEL: 'stable'

jobs:
  analyze-test-build:
    name: analyze / test / build apk
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Show toolchain versions
        run: |
          flutter --version
          dart --version
          java -version

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting (non-blocking report)
        run: dart format --output=none --set-exit-if-changed lib test || true

      - name: Analyze
        # 验收要求：flutter analyze 无 error。
        # 第三方包/框架 API 的弃用告警不作为门禁（见 analysis_options.yaml）。
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Unit tests
        # 验收要求：栅格解析、巡逻状态机、动作名解析有单元测试且通过。
        # 纯逻辑单测不接触网络；不涉及任何移动指令下发（FR-SAFE-05）。
        run: flutter test --reporter expanded

      - name: Generate Android platform project
        # android/ 目录不入库，由 CI 现场生成（见 .gitignore 与 README）。
        run: flutter create --platforms=android --org com.wizrole .

      - name: Harden Android project
        # 注入 usesCleartextTraffic、INTERNET 权限与中文 App 名称（开发文档 §8.3）。
        run: python3 tool/prepare_android.py

      - name: Upload hardening artifacts for inspection
        uses: actions/upload-artifact@v4
        with:
          name: android-platform-gradle
          path: |
            android/app/src/main/AndroidManifest.xml
            android/app/build.gradle*
          if-no-files-found: warn

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Build release APK (unsigned distribution build)
        run: flutter build apk --release

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: robot-ops-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
